name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    # - name: Add MSBuild to PATH
      # uses: microsoft/setup-msbuild@v1

    # - name: Restore NuGet packages
      # working-directory: ${{env.GITHUB_WORKSPACE}}
      # run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    # - name: Build
      # working-directory: ${{env.GITHUB_WORKSPACE}}
      # # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      # run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
      
      ###dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      ###dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true
      
    - name: publish-windows
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: publish-linux
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
      
    - name: Show Infos
      run: | 
        echo 'Workspace path ${{ github.workspace }} - runner.temp ${{ runner.temp }}'
        ls -la publish        
      
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}\ClockConsoleApp.exe, ${{ github.workspace }}\publish\ClockConsoleApp
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        